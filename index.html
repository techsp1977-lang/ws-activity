<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WS Activities</title>
<meta name="description" content="Western Springs Stake youth activity ideas">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WS Activities">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" sizes="180x180" href="ws-touch-icon.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="ws-favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="ws-icon-192.png?v=4">
<link rel="icon" type="image/png" sizes="512x512" href="ws-icon-512.png?v=4">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="manifest" href="manifest.webmanifest?v=4">
<style>
  html,body{margin:0;height:100%;background:#f2f2f7}
  @media (prefers-color-scheme:dark){html,body{background:#000}}
  .frame{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
  iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
  <!-- The real app lives in Google Apps Script; this page gives it a proper home-screen icon and name. -->
  <div class="frame">
    <iframe id="app" title="WS Activities" allow="clipboard-write"></iframe>
  </div>
  <script>
  // Opens the app. A leader link (?leader=...) is remembered on this phone, so the app
  // keeps opening with the leader tools, including after Share > Add to Home Screen.
  (function () {
    var EXEC = "https://script.google.com/macros/s/AKfycby2BnkxV1-1mul9RatW0z7z_q91pOW3lnFQTxuQllXoODv-xCWKwQHvG1281IP3KDZf/exec";
    var KEY = "ws-leader";
    var q = new URLSearchParams(location.search).get("leader");
    var code = q;
    try { if (q) localStorage.setItem(KEY, q); else code = localStorage.getItem(KEY); } catch (e) {}
    document.getElementById("app").src = EXEC + (code ? "?leader=" + encodeURIComponent(code) : "");
    if (!code) return;
    var self = location.origin + location.pathname + "?leader=" + encodeURIComponent(code);
    if (!q) history.replaceState(null, "", self);
    var base = location.origin + location.pathname;
    var m = document.querySelector('link[rel="manifest"]');
    if (m) m.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify({
      name: "WS Activities", short_name: "WS Activities", start_url: self, scope: base, display: "standalone",
      background_color: "#f2f2f7", theme_color: "#1e2940",
      icons: [{ src: base + "ws-icon-192.png?v=4", sizes: "192x192", type: "image/png" },
              { src: base + "ws-icon-512.png?v=4", sizes: "512x512", type: "image/png" }]
    }));
    // If the app says this leader link was turned off, forget it here too.
    addEventListener("message", function (e) {
      if (e.data && e.data.app === "activities" && e.data.leader === "invalid") {
        try { localStorage.removeItem(KEY); } catch (x) {}
        history.replaceState(null, "", location.pathname);
      }
    });
  })();
  </script>
</body>
</html>
